<main id="main" tabindex="-1" class="outline-none">
<section class="relative isolate">
<div class="container-site hero-enter relative z-10 py-16 md:py-24">
<p class="eyebrow text-pine/80"><span aria-hidden="true" class="tracking-normal">•—•</span> Bonus</p>
<h1 class="mt-5 max-w-3xl text-balance font-display text-2xl font-semibold text-pine md:text-3xl">Generátor piesní</h1>
<p class="mt-4 max-w-2xl text-pretty text-lg text-ink/80">Zadaj, z koľkých scénok pozostáva táborák, a zostavíme oblúk piesní a scénok: od veselých piesní na úvod cez pokojnejšie melódie až po záverečný kruh priateľstva.</p>
</div>
</section>
<section class="border-t border-sand/40">

<div class="nf-card mx-auto" data-reveal="">

<div>
<label for="nf-num">Počet scénok</label>

</div>

</div>
<div class="nf-curve" id="nf-curve">
<svg viewBox="0 0 600 64" preserveAspectRatio="none" aria-hidden="true"></svg>
<div class="nf-curve-lbl"><span>Veselá</span><span>Stredne veselá</span><span>Stredná</span><span>Stredne smutná</span><span>Smutná</span><span>Kruh lásky</span></div>
</div>
<div class="nf-add-bar" id="nf-add-bar"></div>
<div class="nf-list" id="nf-list">

</div>
</div>
</div>
</section>
